# =============================================================================
# Attention U-Net Configuration for Key Diagnostic Area (KDA) Prediction
# =============================================================================
#
# This configuration file defines hyperparameters for training the
# Attention U-Net model to predict Key Diagnostic Areas from nuclear
# segmentation masks generated by AFN-DeSeg.
#
# Reference:
#   Oktay et al., "Attention U-Net: Learning Where to Look for the Pancreas"
#   MIDL 2018
#
# =============================================================================

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
model:
  # Input specification
  in_channels: 1          # Binary nuclear mask input (single channel)

  # Network architecture
  base_filters: 64        # Number of filters in first encoder block
                          # Progression: 64 -> 128 -> 256 -> 512 -> 1024

  # Output specification
  num_classes: 1          # Binary KDA prediction (single channel)

  # Attention gate configuration
  attention_filters: 256  # Intermediate channels in attention gates
                          # Higher values capture more complex attention patterns

  # Regularization
  dropout: 0.1            # Dropout rate in encoder/decoder blocks
                          # Applied after pooling in deeper layers

  # Advanced options
  deep_supervision: false # Enable auxiliary outputs at intermediate scales

# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  # Basic training parameters
  batch_size: 8           # Batch size (adjust based on GPU memory)
  num_epochs: 100         # Maximum number of training epochs

  # Optimizer settings (Adam)
  learning_rate: 0.0001   # Initial learning rate (1e-4)
  weight_decay: 0.00001   # L2 regularization (1e-5)

  # Gradient clipping
  grad_clip: 1.0          # Maximum gradient norm

  # Loss function weights
  # L_total = bce_weight * BCE + dice_weight * Dice
  bce_weight: 1.0         # Binary Cross-Entropy weight
  dice_weight: 1.0        # Dice loss weight

  # Learning rate scheduler (ReduceLROnPlateau)
  scheduler:
    mode: min             # Reduce LR when validation loss stops decreasing
    patience: 10          # Epochs to wait before reducing LR
    factor: 0.5           # LR reduction factor
    min_lr: 0.0000001     # Minimum learning rate (1e-7)

  # Early stopping
  patience: 20            # Stop training after N epochs without improvement
  min_delta: 0.001        # Minimum change to qualify as improvement

  # Checkpointing
  save_every: 10          # Save checkpoint every N epochs
  save_best_only: true    # Only keep the best model checkpoint

# -----------------------------------------------------------------------------
# Data Configuration
# -----------------------------------------------------------------------------
data:
  # Input: Nuclear segmentation masks from AFN-DeSeg
  # Output: Ground truth KDA masks (from pathologist annotations)

  # Data splits
  train_split: 0.70       # 70% for training
  val_split: 0.15         # 15% for validation
  test_split: 0.15        # 15% for testing

  # Image specifications
  img_size: 512           # Expected input image size (square)

  # Data augmentation (training only)
  augmentation:
    enabled: true
    random_flip: true           # Horizontal and vertical flips
    random_rotate: true         # Random rotation (90, 180, 270 degrees)
    random_crop: false          # Random cropping (disabled by default)
    elastic_deform: false       # Elastic deformation (computationally expensive)
    intensity_shift: false      # Not applicable for binary masks

  # DataLoader settings
  num_workers: 4          # Number of data loading workers
  pin_memory: true        # Pin memory for faster GPU transfer
  prefetch_factor: 2      # Number of batches to prefetch

# -----------------------------------------------------------------------------
# Inference Configuration
# -----------------------------------------------------------------------------
inference:
  # Prediction settings
  threshold: 0.5          # Probability threshold for binarization

  # Post-processing
  min_area: 100           # Minimum KDA region area (pixels)
                          # Removes small spurious predictions

  # Output options
  save_probability: false # Save probability maps instead of binary masks
  save_attention: false   # Save attention maps for visualization

  # Batch inference
  batch_size: 16          # Batch size for inference (can be larger than training)

# -----------------------------------------------------------------------------
# Evaluation Metrics
# -----------------------------------------------------------------------------
evaluation:
  # Primary metrics (for model selection)
  primary_metric: dice    # Use Dice score for best model selection

  # Metrics to compute
  metrics:
    - dice                # Dice Similarity Coefficient
    - iou                 # Intersection over Union
    - sensitivity         # True Positive Rate
    - specificity         # True Negative Rate
    - hd95                # 95th percentile Hausdorff Distance
    - kaf                 # Key Area Fraction

  # Correlation analysis (for clinical validation)
  correlation:
    enabled: true
    n_samples: 200        # Number of samples for analysis
    confidence: 0.95      # Confidence level for limits of agreement

# -----------------------------------------------------------------------------
# Hardware & Environment
# -----------------------------------------------------------------------------
hardware:
  device: auto            # 'auto', 'cuda', 'cpu'
  mixed_precision: false  # Use automatic mixed precision (FP16)
  cudnn_benchmark: true   # Enable cuDNN autotuner

# -----------------------------------------------------------------------------
# Logging & Visualization
# -----------------------------------------------------------------------------
logging:
  log_interval: 10        # Log every N batches
  tensorboard: false      # Enable TensorBoard logging
  wandb: false            # Enable Weights & Biases logging

  # Visualization
  visualize_attention: true  # Visualize attention maps during validation
  save_predictions: true     # Save predictions during evaluation

# -----------------------------------------------------------------------------
# Experiment Tracking
# -----------------------------------------------------------------------------
experiment:
  name: kda_attention_unet
  seed: 42                # Random seed for reproducibility
  deterministic: true     # Use deterministic algorithms (slower but reproducible)
